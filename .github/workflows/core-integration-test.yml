name: Core + AquaEye integration checks
on:
  push:
    branches:
      - arquitectura-nucleo-compartido-v3
  pull_request:
    paths:
      - 'core/**'
      - 'adapters/**'
      - 'tests/**'
      - '.github/workflows/core-integration-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared Monte Carlo and AquaEye adapter
        run: node --test tests/uncertainty-v3.test.js tests/salmon-integration.test.js
